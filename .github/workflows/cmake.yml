name: CMake Build

on:
  push:
    branches: [main]
    tags: '*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      cmake_flags:
        description: Extra flags to pass to CMake
        required: false
        default: ''
      ctest_flags:
        description: Extra flags to pass to CTest
        required: false
        default: ''
      make_flags:
        description: Extra flags to pass to make
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo
  INSTALL_PREFIX: /tmp/libasdf

jobs:
  build_matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [clang, gcc]
        cmake_options: ["", "-DENABLE_ASAN=ON"]
        include:
          - cc: clang
            cxx: clang++
          - cc: gcc
            cxx: g++
        exclude:
          - os: macos-latest
            cc: gcc
            cmake_options: ""
          - os: macos-latest
            cc: gcc
            cmake_options: "-DENABLE_ASAN=ON"
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: Linux dependencies
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt update
        sudo apt install -y \
            build-essential \
            clang \
            libfyaml-dev \
            libbz2-dev \
            liblz4-dev \
            zlib1g-dev \
            libmd-dev \
            libstatgrab-dev

    - name: MacOS dependencies
      if: startsWith(matrix.os, 'macos')
      run: |
        brew update
        brew install \
            argp-standalone \
            libfyaml \
            libstatgrab \
            libmd \
            lz4

    - name: Setup ccache action
      uses: Chocobo1/setup-ccache-action@v1.5.1
      with:
        remove_stale_cache: false
        update_packager_index: false

    - name: Linux build
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }} \
          -DENABLE_TESTING_ALL=YES \
          ${{ matrix.cmake_options }} \
          ${{ github.event.inputs.cmake_flags }}
        make VERBOSE=1 ${{ github.event.inputs.make_flags }}

    - name: MacOS build
      if: startsWith(matrix.os, 'macos')
      env:
        PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig

      run: |
        mkdir -p build
        cd build
        export SDKROOT="$(xcrun --show-sdk-path)"
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }} \
          -DENABLE_TESTING_ALL=YES \
          ${{ matrix.cmake_options }} \
          ${{ github.event.inputs.cmake_flags }}
        make VERBOSE=1 ${{ github.event.inputs.make_flags }}


    - name: Install
      run: |
        cd build
        make VERBOSE=1 install

    - name: Generate source archive
      run: |
        cd build
        make VERBOSE=1 package_source

    - name: Generate binary archives
      run: |
        cd build
        make VERBOSE=1 package

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: |
        ctest -C ${{env.BUILD_TYPE}} \
            ${{ github.event.inputs.ctest_flags }}


    - name: Output test logs on failure
      if: failure()
      working-directory: ${{github.workspace}}/build
      run: |
        logfile=Testing/Temporary/LastTest.log
        if ! [ -f "$logfile" ]; then
            echo "No log file. Did the tests run at all?"
            exit 0
        fi
        cat "$logfile"

  # MSVC. PowerShell rather than Git Bash, which rewrites POSIX paths on the way
  # to native programs. The command-line tool is not built: it needs argp.
  windows:
    name: 'Windows (MSVC)'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: Install dependencies
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        vcpkg install zlib bzip2 lz4 pkgconf --triplet x64-windows
        $pkgconf = Get-ChildItem -Recurse "$env:VCPKG_INSTALLATION_ROOT\installed" `
            -Filter 'pkgconf.exe' | Select-Object -First 1 -ExpandProperty FullName
        if (-not $pkgconf) { throw 'pkgconf.exe not found' }
        "ASDF_PKG_CONFIG=$pkgconf" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

    # libfyaml has no Windows package, but builds with MSVC.
    - name: Build libfyaml
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        git clone --depth 1 https://github.com/pantoniou/libfyaml.git third_party/libfyaml
        cmake -S third_party/libfyaml -B third_party/libfyaml/build `
          -DCMAKE_INSTALL_PREFIX="$PWD\third_party\libfyaml\install" `
          -DBUILD_SHARED_LIBS=OFF
        cmake --build third_party/libfyaml/build --config $env:BUILD_TYPE
        cmake --install third_party/libfyaml/build --config $env:BUILD_TYPE

    # /Zc:preprocessor is required: asdf_open and asdf_write_to dispatch on a
    # __VA_ARGS__ argument count, which MSVC's traditional preprocessor miscounts.
    - name: Configure
      shell: pwsh
      run: |
        $fy = "$PWD\third_party\libfyaml\install"
        $vcpkg = $env:VCPKG_INSTALLATION_ROOT
        $env:PKG_CONFIG_PATH = "$vcpkg\installed\x64-windows\lib\pkgconfig"
        cmake -S . -B build `
          -DCMAKE_TOOLCHAIN_FILE="$vcpkg\scripts\buildsystems\vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DPKG_CONFIG_EXECUTABLE="$env:ASDF_PKG_CONFIG" `
          -DUSE_STATGRAB=OFF `
          -DFYAML_NO_PKGCONFIG=YES `
          -DFYAML_INCLUDEDIR="$fy\include" `
          -DFYAML_LIBDIR="$fy\lib" `
          -DCMAKE_C_FLAGS="/Zc:preprocessor" `
          -DENABLE_TESTING_ALL=YES

    - name: Build
      shell: pwsh
      run: cmake --build build --config $env:BUILD_TYPE

    # A crashing test otherwise opens an error-reporting dialog and waits.
    - name: Disable crash dialogs
      shell: pwsh
      run: |
        $k = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
        New-ItemProperty -Path $k -Name DontShowUI -Value 1 -PropertyType DWord -Force | Out-Null

    - name: Test
      shell: pwsh
      working-directory: build
      timeout-minutes: 10
      run: |
        $env:PATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
        ctest -C $env:BUILD_TYPE --timeout 60 --output-on-failure

  # Test the documentation build if the build passes
  docs:
    name: 'Build documentation'
    runs-on: ubuntu-latest
    needs: build_matrix
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libclang-dev \
            libfyaml-dev \
            libbz2-dev \
            liblz4-dev \
            zlib1g-dev \
            libstatgrab-dev \
            llvm \
            python3-sphinx \
            python3-clang
          # Don't use docs/requirements.txt here since we are trying with the
          # system packages for sphinx and clang
          pip install furo hawkmoth

      - name: Set LD_LIBRARY_PATH
        run: echo "LD_LIBRARY_PATH=$(llvm-config --libdir):$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. \
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
              -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }} \
              -DENABLE_DOCS=YES \
              ${{ matrix.cmake_options }} \
              ${{ github.event.inputs.cmake_flags }}

      - name: Build Sphinx documentation
        run: |
          cd build
          make docs SPHINX_FLAGS=-W

      - name: Install Sphinx documentation
        run: |
          cd build
          make install
