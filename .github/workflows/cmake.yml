name: CMake Build

on:
  push:
    branches: [main]
    tags: '*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      cmake_flags:
        description: Extra flags to pass to CMake
        required: false
        default: ''
      ctest_flags:
        description: Extra flags to pass to CTest
        required: false
        default: ''
      make_flags:
        description: Extra flags to pass to make
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo
  INSTALL_PREFIX: /tmp/libasdf

jobs:
  build_matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        cc: [clang, gcc]
        cmake_options: ["", "-DENABLE_ASAN=ON"]
        exclude:
          - os: macos-14
            cc: gcc
            cmake_options: ""
          - os: macos-14
            cc: gcc
            cmake_options: "-DENABLE_ASAN=ON"
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: true

    - name: Linux dependencies
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt update
        sudo apt install -y \
            build-essential \
            clang \
            libfyaml-dev \
            libbz2-dev \
            liblz4-dev \
            zlib1g-dev \
            libmd-dev \
            libstatgrab-dev

    - name: MacOS dependencies
      if: startsWith(matrix.os, 'macos')
      run: |
        brew update
        brew install \
            argp-standalone \
            libfyaml \
            libstatgrab \
            libmd \
            lz4

    - name: Setup ccache action
      uses: Chocobo1/setup-ccache-action@v1.5.1

    - name: Linux build
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }} \
          -DENABLE_TESTING_ALL=YES \
          ${{ matrix.cmake_options }} \
          ${{ github.event.inputs.cmake_flags }}
        make VERBOSE=1 ${{ github.event.inputs.make_flags }}

    - name: MacOS build
      if: startsWith(matrix.os, 'macos')
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cc }}++
        PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig

      run: |
        mkdir -p build
        cd build
        export SDKROOT="$(xcrun --show-sdk-path)"
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }} \
          -DENABLE_TESTING_ALL=YES \
          ${{ matrix.cmake_options }} \
          ${{ github.event.inputs.cmake_flags }}
        make VERBOSE=1 ${{ github.event.inputs.make_flags }}


    - name: Install
      run: |
        cd build
        make VERBOSE=1 install

    - name: Generate source archive
      run: |
        cd build
        make VERBOSE=1 package_source

    - name: Generate binary archives
      run: |
        cd build
        make VERBOSE=1 package

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: |
        ctest -C ${{env.BUILD_TYPE}} \
            ${{ github.event.inputs.ctest_flags }}


    - name: Output test logs on failure
      if: failure()
      working-directory: ${{github.workspace}}/build
      run: |
        logfile=Testing/Temporary/LastTest.log
        if ! [ -f "$logfile" ]; then
            echo "No log file. Did the tests run at all?"
            exit 0
        fi
        cat "$logfile"

  # An experiment, not a gate: find out what actually stands between libasdf
  # and an MSVC build. It is deliberately arranged to get as far as it can and
  # report everything in one run rather than stopping at the first failure, so
  # every step after the dependency probe keeps going on error.
  windows:
    name: 'Windows (MSVC) -- exploratory'
    runs-on: windows-latest
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Which dependencies does vcpkg have?
      shell: bash
      continue-on-error: true
      run: |
        for p in zlib bzip2 lz4 libfyaml libmd libstatgrab argp-standalone; do
          if vcpkg search "$p" 2>/dev/null | grep -qiE "^$p( |\\[)"; then
            echo "AVAILABLE   $p"
          else
            echo "MISSING     $p"
          fi
        done

    - name: Install what vcpkg has
      shell: bash
      continue-on-error: true
      run: vcpkg install zlib bzip2 lz4 --triplet x64-windows

    - name: Configure
      shell: bash
      continue-on-error: true
      run: |
        mkdir -p build && cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=x64-windows \
          -DUSE_STATGRAB=OFF \
          -DENABLE_TESTING_ALL=YES 2>&1 | tee configure.log
        echo "=== configure exit: ${PIPESTATUS[0]}"

    - name: Build
      shell: bash
      continue-on-error: true
      run: cmake --build build --config ${{ env.BUILD_TYPE }} 2>&1 | tail -100

    - name: Test
      shell: bash
      continue-on-error: true
      run: cd build && ctest -C ${{ env.BUILD_TYPE }} --output-on-failure 2>&1 | tail -60

    # Whatever happened above, say what the source itself relies on that MSVC
    # does not have. This runs unconditionally and is the useful output when
    # the configure step never gets far enough to produce any.
    - name: What in the source is POSIX-only?
      shell: bash
      if: always()
      run: |
        echo "== POSIX headers included by src/ and include/"
        grep -rhoE '#include <(sys/[a-z]+|unistd|strings|pthread|dirent|fcntl|glob|libgen|argp|err|endian|arpa/[a-z]+)\.h>' \
          src include | sort | uniq -c | sort -rn
        echo
        echo "== POSIX functions and types named in src/"
        grep -rhoE '\b(ssize_t|off_t|mode_t|pid_t|strerror_r|strndup|strdup|mmap|munmap|open|close|read|write|fsync|ftruncate|getline|asprintf|vasprintf|realpath|mkstemp|setenv|unsetenv|localtime_r|gmtime_r|timegm|nanosleep|clock_gettime|__attribute__)\b' \
          src | sort | uniq -c | sort -rn | head -30

  # Test the documentation build if the build passes
  docs:
    name: 'Build documentation'
    runs-on: ubuntu-latest
    needs: build_matrix
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libclang-dev \
            libfyaml-dev \
            libbz2-dev \
            liblz4-dev \
            zlib1g-dev \
            libstatgrab-dev \
            llvm \
            python3-sphinx \
            python3-clang
          # Don't use docs/requirements.txt here since we are trying with the
          # system packages for sphinx and clang
          pip install furo hawkmoth

      - name: Set LD_LIBRARY_PATH
        run: echo "LD_LIBRARY_PATH=$(llvm-config --libdir):$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. \
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
              -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }} \
              -DENABLE_DOCS=YES \
              ${{ matrix.cmake_options }} \
              ${{ github.event.inputs.cmake_flags }}

      - name: Build Sphinx documentation
        run: |
          cd build
          make docs SPHINX_FLAGS=-W

      - name: Install Sphinx documentation
        run: |
          cd build
          make install
