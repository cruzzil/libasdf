name: CMake Build

on:
  push:
    branches: [main]
    tags: '*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      cmake_flags:
        description: Extra flags to pass to CMake
        required: false
        default: ''
      ctest_flags:
        description: Extra flags to pass to CTest
        required: false
        default: ''
      make_flags:
        description: Extra flags to pass to make
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo
  INSTALL_PREFIX: /tmp/libasdf

jobs:
  build_matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        cc: [clang, gcc]
        cmake_options: ["", "-DENABLE_ASAN=ON"]
        exclude:
          - os: macos-14
            cc: gcc
            cmake_options: ""
          - os: macos-14
            cc: gcc
            cmake_options: "-DENABLE_ASAN=ON"
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: true

    - name: Linux dependencies
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt update
        sudo apt install -y \
            build-essential \
            clang \
            libfyaml-dev \
            libbz2-dev \
            liblz4-dev \
            zlib1g-dev \
            libmd-dev \
            libstatgrab-dev

    - name: MacOS dependencies
      if: startsWith(matrix.os, 'macos')
      run: |
        brew update
        brew install \
            argp-standalone \
            libfyaml \
            libstatgrab \
            libmd \
            lz4

    - name: Setup ccache action
      uses: Chocobo1/setup-ccache-action@v1.5.1

    - name: Linux build
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }} \
          -DENABLE_TESTING_ALL=YES \
          ${{ matrix.cmake_options }} \
          ${{ github.event.inputs.cmake_flags }}
        make VERBOSE=1 ${{ github.event.inputs.make_flags }}

    - name: MacOS build
      if: startsWith(matrix.os, 'macos')
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cc }}++
        PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig

      run: |
        mkdir -p build
        cd build
        export SDKROOT="$(xcrun --show-sdk-path)"
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }} \
          -DENABLE_TESTING_ALL=YES \
          ${{ matrix.cmake_options }} \
          ${{ github.event.inputs.cmake_flags }}
        make VERBOSE=1 ${{ github.event.inputs.make_flags }}


    - name: Install
      run: |
        cd build
        make VERBOSE=1 install

    - name: Generate source archive
      run: |
        cd build
        make VERBOSE=1 package_source

    - name: Generate binary archives
      run: |
        cd build
        make VERBOSE=1 package

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: |
        ctest -C ${{env.BUILD_TYPE}} \
            ${{ github.event.inputs.ctest_flags }}


    - name: Output test logs on failure
      if: failure()
      working-directory: ${{github.workspace}}/build
      run: |
        logfile=Testing/Temporary/LastTest.log
        if ! [ -f "$logfile" ]; then
            echo "No log file. Did the tests run at all?"
            exit 0
        fi
        cat "$logfile"

  # An experiment, not a gate, and not for upstream: find out what actually
  # stands between libasdf and an MSVC build.
  #
  # PowerShell and cmd throughout, deliberately. Git Bash is on the runner but
  # a Windows developer is not using it, and it silently rewrites POSIX paths
  # into Windows ones on the way to native programs -- so a job written in
  # bash tests MSYS's path translation as much as it tests the build.
  windows:
    name: 'Windows (MSVC) -- exploratory'
    runs-on: windows-latest
    continue-on-error: true
    # A hung test held a runner for a day before this was here.
    timeout-minutes: 45
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    # zlib, bzip2 and lz4 are all in vcpkg and ship `.pc` files, so with
    # pkg-config present the existing detection finds them unchanged.
    - name: Dependencies vcpkg can supply
      shell: pwsh
      continue-on-error: true
      run: |
        vcpkg install zlib bzip2 lz4 --triplet x64-windows
        choco install -y --no-progress pkgconfiglite

    # libfyaml is the one dependency with no Windows package, and src/util.h
    # includes libfyaml.h, so nothing compiles without it. It supports MSVC
    # natively -- see its own doc/windows-support.txt -- so vendor and build it.
    - name: Vendor and build libfyaml
      shell: pwsh
      continue-on-error: true
      run: |
        git clone --depth 1 https://github.com/pantoniou/libfyaml.git third_party/libfyaml
        $install = Join-Path $PWD 'third_party\libfyaml\install'
        cmake -S third_party/libfyaml -B third_party/libfyaml/build `
          -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
          -DCMAKE_INSTALL_PREFIX="$install" `
          -DBUILD_SHARED_LIBS=OFF 2>&1 | Select-Object -Last 15
        cmake --build third_party/libfyaml/build --config $env:BUILD_TYPE 2>&1 |
            Tee-Object fyaml.log | Select-Object -Last 10
        cmake --install third_party/libfyaml/build --config $env:BUILD_TYPE 2>&1 |
            Select-Object -Last 3
        Write-Host "=== libfyaml errors, if any:"
        Select-String -Path fyaml.log -Pattern 'error C\d+' |
            ForEach-Object { $_.Line } | Sort-Object -Unique | Select-Object -First 10

    # Tests are on; the tool is not -- main.c wants argp, which has no Windows
    # port, and the configure now detects that and says so.
    - name: Configure
      shell: pwsh
      continue-on-error: true
      run: |
        $fy = Join-Path $PWD 'third_party\libfyaml\install'
        $vcpkg = $env:VCPKG_INSTALLATION_ROOT
        $env:PKG_CONFIG_PATH = "$vcpkg\installed\x64-windows\lib\pkgconfig"
        cmake -S . -B build `
          -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
          -DCMAKE_TOOLCHAIN_FILE="$vcpkg\scripts\buildsystems\vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DUSE_STATGRAB=OFF `
          -DFYAML_NO_PKGCONFIG=YES `
          -DFYAML_INCLUDEDIR="$fy\include" `
          -DFYAML_LIBDIR="$fy\lib" `
          -DCMAKE_C_FLAGS="/Zc:preprocessor" `
          -DENABLE_TESTING_ALL=YES 2>&1 | Select-Object -Last 30
        Write-Host "=== configure exit: $LASTEXITCODE"

    - name: Build, and classify what fails
      shell: pwsh
      continue-on-error: true
      run: |
        cmake --build build --config $env:BUILD_TYPE 2>&1 | Tee-Object build.log | Out-Null
        Write-Host "=== build exit: $LASTEXITCODE"
        Write-Host ""
        Write-Host "================ missing headers ================"
        Select-String -Path build.log -Pattern "Cannot open include file: '([^']+)'" |
            ForEach-Object { $_.Matches[0].Groups[1].Value } |
            Group-Object | Sort-Object Count -Descending |
            ForEach-Object { "{0,4}  {1}" -f $_.Count, $_.Name }
        Write-Host ""
        Write-Host "================ distinct errors ================"
        Select-String -Path build.log -Pattern 'error [A-Z]+\d+:' |
            ForEach-Object { ($_.Line -replace ' \[[A-Z]:.*$', '') -replace '.*libasdf.libasdf.', '' } |
            Where-Object { $_ -notmatch 'Cannot open include file' } |
            Sort-Object -Unique | Select-Object -First 40
        Write-Host ""
        Write-Host "================ last 25 lines ================"
        Get-Content build.log -Tail 25

    # A crash on Windows pops a Windows Error Reporting dialog and waits for a
    # click that will never come, which is what hung the first attempt.
    - name: Silence the crash dialogs
      shell: pwsh
      continue-on-error: true
      run: |
        $k = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
        New-ItemProperty -Path $k -Name DontShowUI -Value 1 -PropertyType DWord -Force | Out-Null
        New-ItemProperty -Path $k -Name Disabled  -Value 1 -PropertyType DWord -Force | Out-Null

    - name: Run the test suite
      shell: pwsh
      timeout-minutes: 10
      continue-on-error: true
      run: |
        $env:PATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
        Push-Location build
        ctest -C $env:BUILD_TYPE --timeout 20 --output-on-failure 2>&1 |
            Tee-Object ctest.log | Out-Null
        Write-Host "=== ctest exit: $LASTEXITCODE"
        Get-Content ctest.log -Tail 45
        Pop-Location

    - name: Smoke test the DLL
      shell: pwsh
      continue-on-error: true
      run: |
        @'
        #include <asdf.h>
        #include <stdio.h>
        #include <string.h>

        int main(void) {
            asdf_file_t *w = asdf_open("smoke.asdf", "w");
            if (!w) { puts("open for write failed"); return 1; }
            asdf_set_string0(w, "name", "Dennis Ritchie");
            asdf_set_int64(w, "answer", 42);
            if (asdf_write_to(w, "smoke.asdf") != 0) { puts("write failed"); return 1; }
            asdf_close(w);

            asdf_file_t *r = asdf_open("smoke.asdf", "r");
            if (!r) { puts("open for read failed"); return 1; }
            const char *name = NULL;
            int64_t answer = 0;
            if (asdf_get_string0(r, "name", &name) != ASDF_VALUE_OK) { puts("get name failed"); return 1; }
            if (asdf_get_int64(r, "answer", &answer) != ASDF_VALUE_OK) { puts("get answer failed"); return 1; }
            printf("name=%s answer=%lld\n", name, (long long)answer);
            if (strcmp(name, "Dennis Ritchie") != 0 || answer != 42) { puts("MISMATCH"); return 1; }
            asdf_close(r);
            puts("SMOKE OK");
            return 0;
        }
        '@ | Set-Content -Encoding ascii smoke.c
        Get-ChildItem -Recurse build -Filter '*.lib' | ForEach-Object { $_.FullName }

    # Compiled from a developer command prompt, which is how a Windows user
    # would do it. /Zc:preprocessor is required, not optional: asdf_open and
    # asdf_write_to are _Generic macros dispatched on a __VA_ARGS__ argument
    # count, which MSVC's traditional preprocessor gets wrong.
    - name: Compile and run the smoke test
      shell: cmd
      continue-on-error: true
      run: |
        call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat" >nul
        for /f "delims=" %%L in ('dir /s /b build\src\*.lib') do set ASDFLIB=%%L
        echo using import library: %ASDFLIB%
        cl /nologo /std:c11 /Zc:preprocessor /experimental:c11atomics ^
           /I include /I build\include ^
           /I third_party\libfyaml\install\include ^
           smoke.c /Fe:smoke.exe /link "%ASDFLIB%"
        if errorlevel 1 ( echo COMPILE/LINK FAILED & exit /b 0 )
        for /f "delims=" %%D in ('dir /s /b build\asdf.dll') do copy "%%D" . >nul
        set PATH=%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\bin;%PATH%
        smoke.exe
        echo ---- smoke exit %errorlevel%

  # Test the documentation build if the build passes
  docs:
    name: 'Build documentation'
    runs-on: ubuntu-latest
    needs: build_matrix
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libclang-dev \
            libfyaml-dev \
            libbz2-dev \
            liblz4-dev \
            zlib1g-dev \
            libstatgrab-dev \
            llvm \
            python3-sphinx \
            python3-clang
          # Don't use docs/requirements.txt here since we are trying with the
          # system packages for sphinx and clang
          pip install furo hawkmoth

      - name: Set LD_LIBRARY_PATH
        run: echo "LD_LIBRARY_PATH=$(llvm-config --libdir):$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. \
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
              -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }} \
              -DENABLE_DOCS=YES \
              ${{ matrix.cmake_options }} \
              ${{ github.event.inputs.cmake_flags }}

      - name: Build Sphinx documentation
        run: |
          cd build
          make docs SPHINX_FLAGS=-W

      - name: Install Sphinx documentation
        run: |
          cd build
          make install
