name: CMake Build

on:
  push:
    branches: [main]
    tags: '*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      cmake_flags:
        description: Extra flags to pass to CMake
        required: false
        default: ''
      ctest_flags:
        description: Extra flags to pass to CTest
        required: false
        default: ''
      make_flags:
        description: Extra flags to pass to make
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo
  INSTALL_PREFIX: /tmp/libasdf

jobs:
  build_matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        cc: [clang, gcc]
        cmake_options: ["", "-DENABLE_ASAN=ON"]
        exclude:
          - os: macos-14
            cc: gcc
            cmake_options: ""
          - os: macos-14
            cc: gcc
            cmake_options: "-DENABLE_ASAN=ON"
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: true

    - name: Linux dependencies
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt update
        sudo apt install -y \
            build-essential \
            clang \
            libfyaml-dev \
            libbz2-dev \
            liblz4-dev \
            zlib1g-dev \
            libmd-dev \
            libstatgrab-dev

    - name: MacOS dependencies
      if: startsWith(matrix.os, 'macos')
      run: |
        brew update
        brew install \
            argp-standalone \
            libfyaml \
            libstatgrab \
            libmd \
            lz4

    - name: Setup ccache action
      uses: Chocobo1/setup-ccache-action@v1.5.1

    - name: Linux build
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }} \
          -DENABLE_TESTING_ALL=YES \
          ${{ matrix.cmake_options }} \
          ${{ github.event.inputs.cmake_flags }}
        make VERBOSE=1 ${{ github.event.inputs.make_flags }}

    - name: MacOS build
      if: startsWith(matrix.os, 'macos')
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cc }}++
        PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig

      run: |
        mkdir -p build
        cd build
        export SDKROOT="$(xcrun --show-sdk-path)"
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }} \
          -DENABLE_TESTING_ALL=YES \
          ${{ matrix.cmake_options }} \
          ${{ github.event.inputs.cmake_flags }}
        make VERBOSE=1 ${{ github.event.inputs.make_flags }}


    - name: Install
      run: |
        cd build
        make VERBOSE=1 install

    - name: Generate source archive
      run: |
        cd build
        make VERBOSE=1 package_source

    - name: Generate binary archives
      run: |
        cd build
        make VERBOSE=1 package

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: |
        ctest -C ${{env.BUILD_TYPE}} \
            ${{ github.event.inputs.ctest_flags }}


    - name: Output test logs on failure
      if: failure()
      working-directory: ${{github.workspace}}/build
      run: |
        logfile=Testing/Temporary/LastTest.log
        if ! [ -f "$logfile" ]; then
            echo "No log file. Did the tests run at all?"
            exit 0
        fi
        cat "$logfile"

  # An experiment, not a gate, and not for upstream: find out what actually
  # stands between libasdf and an MSVC build. Everything continues on error so
  # one run reports the whole list rather than stopping at the first failure.
  windows:
    name: 'Windows (MSVC) -- exploratory'
    runs-on: windows-latest
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    # zlib, bzip2 and lz4 are all in vcpkg and install cleanly, and they ship
    # `.pc` files, so with pkg-config present the existing detection finds
    # them unchanged. libmd, libstatgrab and argp are not in vcpkg.
    - name: Dependencies vcpkg can supply
      shell: bash
      continue-on-error: true
      run: |
        vcpkg install zlib bzip2 lz4 --triplet x64-windows
        choco install -y --no-progress pkgconfiglite

    # libfyaml is the one dependency with no Windows package anywhere, and
    # `src/util.h` includes `libfyaml.h`, so nothing compiles without it.
    # It does support MSVC natively, though -- see its own
    # `doc/windows-support.txt` -- so vendor it and build it here.
    - name: Vendor and build libfyaml
      shell: bash
      continue-on-error: true
      run: |
        git clone --depth 1 https://github.com/pantoniou/libfyaml.git third_party/libfyaml
        cmake -S third_party/libfyaml -B third_party/libfyaml/build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_INSTALL_PREFIX="$PWD/third_party/libfyaml/install" \
          -DBUILD_SHARED_LIBS=OFF 2>&1 | tail -25
        echo "=== libfyaml configure exit: ${PIPESTATUS[0]}"
        cmake --build third_party/libfyaml/build --config ${{ env.BUILD_TYPE }} 2>&1 | tee fyaml.log | tail -25
        echo "=== libfyaml build exit: ${PIPESTATUS[0]}"
        cmake --install third_party/libfyaml/build --config ${{ env.BUILD_TYPE }} 2>&1 | tail -5 || true
        echo "=== what got installed:"
        find third_party/libfyaml/install -name '*.h' -o -name '*.lib' -o -name '*.pc' | head -20
        echo "=== distinct libfyaml errors, if any:"
        grep -oE "error C[0-9]+: .*" fyaml.log | sort -u | head -20 || echo "(none)"

    # Tool and tests are off, and both for third-party reasons rather than
    # anything in libasdf: the CLI wants argp, which Windows has no port of,
    # and the munit test framework is built on VLAs, which MSVC does not
    # implement at any /std: level. The library is what this proves.
    - name: Configure libasdf against the vendored libfyaml
      shell: bash
      continue-on-error: true
      run: |
        FY="$PWD/third_party/libfyaml/install"
        mkdir -p build && cd build
        PKG_CONFIG_PATH="$VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib/pkgconfig" \
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=x64-windows \
          -DUSE_STATGRAB=OFF \
          -DENABLE_TOOL=OFF \
          -DFYAML_NO_PKGCONFIG=YES \
          -DFYAML_INCLUDEDIR="$FY/include" \
          -DFYAML_LIBDIR="$FY/lib" \
          -DCMAKE_C_FLAGS="/experimental:c11atomics /std:c11 /Zc:preprocessor" \
          -DENABLE_TESTING_ALL=NO 2>&1 | tail -40
        echo "=== configure exit: ${PIPESTATUS[0]}"

    # Group what is left by cause, so the output is a porting list rather
    # than a wall of C1083s.
    # Compile the actual failing translation unit directly, with and without
    # the conforming preprocessor, rather than inferring from a full build
    # whose flags CMake may or may not have passed through.
    - name: Does src/yaml.c need /Zc:preprocessor?
      shell: cmd
      continue-on-error: true
      run: |
        call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat" >nul
        set INC=/I src /I include /I build\include /I build /I third_party\STC\include /I third_party\libfyaml\install\include /I C:\vcpkg\installed\x64-windows\include
        echo ==== default preprocessor:
        cl /nologo /std:c11 /experimental:c11atomics %INC% /c src\yaml.c /Fo:nul 2>&1 | findstr /C:"error C" | more +0
        echo ==== with /Zc:preprocessor:
        cl /nologo /std:c11 /experimental:c11atomics /Zc:preprocessor %INC% /c src\yaml.c /Fo:nul 2>&1 | findstr /C:"error C" | more +0
        echo ==== done

    # The first error is a broken `_m_value` typedef for `off_t`, so check
    # directly whether MSVC has the type at all in the context libasdf uses it.
    - name: Does MSVC have off_t here?
      shell: cmd
      continue-on-error: true
      run: |
        call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat" >nul
        echo ==== off_t with no includes, as asdf_block_index.h has it:
        echo off_t probe; > offprobe.c
        cl /nologo /std:c11 /c offprobe.c /Fo:nul 2>&1 | findstr /C:"error C" | more +0
        echo ==== off_t after ^<sys/types.h^>:
        echo #include ^<sys/types.h^> > offprobe2.c
        echo off_t probe; >> offprobe2.c
        cl /nologo /std:c11 /c offprobe2.c /Fo:nul 2>&1 | findstr /C:"error C" | more +0
        echo ==== ssize_t after ^<sys/types.h^>:
        echo #include ^<sys/types.h^> > offprobe3.c
        echo ssize_t probe; >> offprobe3.c
        cl /nologo /std:c11 /c offprobe3.c /Fo:nul 2>&1 | findstr /C:"error C" | more +0
        echo ==== done

    - name: What flags did CMake actually record?
      shell: bash
      continue-on-error: true
      run: |
        grep -hE "^CMAKE_C_FLAGS(_RELWITHDEBINFO)?:" build/CMakeCache.txt || true
        echo "--- AdditionalOptions in the generated project:"
        grep -ohE "<AdditionalOptions>[^<]*" build/src/libasdf_objs.vcxproj | sort -u | head -5

    - name: Build, and classify what fails
      shell: bash
      continue-on-error: true
      run: |
        set +e
        cmake --build build --config ${{ env.BUILD_TYPE }} > build.log 2>&1
        echo "=== build exit: $?"
        echo
        echo "================ missing headers, by header ================"
        grep -oE "Cannot open include file: '[^']+'" build.log | sort | uniq -c | sort -rn || echo "(none)"
        echo
        echo "================ other distinct errors ================"
        grep -E "error [A-Z]+[0-9]+:" build.log | sed 's/ \[D:.*//; s|.*libasdf.libasdf.||' \
          | grep -v "Cannot open include file" | sort -u | head -40 || echo "(none)"
        echo
        echo "================ last 40 lines ================"
        tail -40 build.log

    - name: Did the library actually come out?
      shell: bash
      continue-on-error: true
      run: |
        find build -name 'asdf*.lib' -o -name 'asdf*.dll' | sort
        echo "--- errors in libasdf's own sources:"
        grep -cE "libasdf.src.[A-Za-z0-9_/\\\\.]+[.](c|h)\([0-9]+,[0-9]+\): error" build.log || echo 0

    - name: What in the source is POSIX-only?
      shell: bash
      if: always()
      run: |
        echo "== POSIX headers, and which files include them"
        for h in sys/mman.h unistd.h pthread.h sys/eventfd.h sys/syscall.h \
                 sys/poll.h sys/ioctl.h endian.h argp.h sys/time.h; do
          printf "%-18s " "$h"
          grep -rl "#include <$h>" src include 2>/dev/null | tr '\n' ' '
          echo
        done
        echo
        echo "== POSIX functions and types named in src/"
        grep -rhoE '\b(ssize_t|off_t|strerror_r|strndup|mmap|munmap|ftruncate|getline|asprintf|realpath|mkstemp|localtime_r|gmtime_r|timegm|strptime|nanosleep|clock_gettime)\b' \
          src | sort | uniq -c | sort -rn

  # Test the documentation build if the build passes
  docs:
    name: 'Build documentation'
    runs-on: ubuntu-latest
    needs: build_matrix
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libclang-dev \
            libfyaml-dev \
            libbz2-dev \
            liblz4-dev \
            zlib1g-dev \
            libstatgrab-dev \
            llvm \
            python3-sphinx \
            python3-clang
          # Don't use docs/requirements.txt here since we are trying with the
          # system packages for sphinx and clang
          pip install furo hawkmoth

      - name: Set LD_LIBRARY_PATH
        run: echo "LD_LIBRARY_PATH=$(llvm-config --libdir):$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. \
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
              -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }} \
              -DENABLE_DOCS=YES \
              ${{ matrix.cmake_options }} \
              ${{ github.event.inputs.cmake_flags }}

      - name: Build Sphinx documentation
        run: |
          cd build
          make docs SPHINX_FLAGS=-W

      - name: Install Sphinx documentation
        run: |
          cd build
          make install
